# persistlog settings, read by /userdata/persistlog.sh at startup.
# Restart after editing: reboot, or run ./install.sh persistlog-install <robot-ip>

# Where logs are kept (persistent flash, not the RAM-backed /userdata/logs).
STORE=/userdata/persist-logs

# Total size cap of STORE in MB. The oldest boots are deleted first.
MAX_MB=64

# Skip copying when free space on /userdata is below this many MB.
MIN_FREE_MB=50

# Seconds between sync cycles.
INTERVAL=600

# Extra active text logs, snapshotted like the vendor logs.
EXTRA_LOGS="/tmp/valetudo.log /tmp/camstream.log"

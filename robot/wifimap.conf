# wifimap settings, read by /userdata/wifimap.sh at startup.
# Restart after editing: reboot, or run ./install.sh wifimap-install <robot-ip>

# Minimum seconds between two samples while the robot moves.
INTERVAL_S=1

# A pause in the robot's position updates longer than this many seconds
# starts a new job file (a dock mop wash is shorter than the default).
JOB_GAP_S=900

# How often, in seconds, to look up the access point (BSSID) and channel.
BSSID_EVERY_S=10

# Keep this many job files; the oldest are deleted beyond that.
MAX_JOBS=100

# Write buffered samples to flash at most this often, in seconds.
FLUSH_S=30

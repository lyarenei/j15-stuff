# tankwatch settings, read by /userdata/tankwatch.sh at startup.
# Restart after editing: reboot, or run ./install.sh tankwatch-install <robot-ip>

# Tank capacities in mL.
CLEAN_CAPACITY_ML=4000
DIRTY_CAPACITY_ML=3400

# mL per unit of the dock's water_pump_flow reading per second (the reading
# looks like mL/min, so 1/60).
FLOW_ML_PER_UNIT_S=0.016667

# mL the robot's onboard tank refill takes from the clean tank per second.
REFILL_ML_PER_S=3.1

# mL the dirty water pump moves into the dirty tank per second of running.
DIRTY_ML_PER_PUMP_S=1.4

# A tank is "low" below this many percent remaining (clean) or free (dirty).
LOW_PCT=20
